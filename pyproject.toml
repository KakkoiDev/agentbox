[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentbox"
version = "0.1.0"
description = "Open the pi coding agent in a macOS sandbox with any model: local (Ollama) or DeepSeek's hosted model"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agentbox = "agentbox.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentbox"]
